name: Build

on:
  push:
    branches: [ remove-island-level, dev, main ]
  pull_request:
    branches: [ remove-island-level, dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 8 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up JDK 21 (toolchain for modern NMS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.4.1'

      - name: Print Java versions
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "---"
          ls $JAVA_HOME_8_X64/bin/ 2>/dev/null | head -3 || true
          echo "JAVA_HOME_8_X64=$JAVA_HOME_8_X64"
          echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64"

      - name: Patch gradle.properties for toolchain path
        run: |
          # Remove the local JDK path override (CI has its own JDKs)
          sed -i '/org.gradle.java.installations.paths/d' gradle.properties
          cat gradle.properties

      - name: Build with Gradle
        run: ./gradlew build -x checkDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Show errors if build failed
        if: failure()
        run: |
          echo "=== Build failed. Searching for errors... ==="
          grep -E "error:|FAILURE|Exception" build.log | head -50 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-jars
          path: target/
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
