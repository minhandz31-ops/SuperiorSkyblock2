title: '&lPermissions'
previous-menu: true

# 27-slot chest (3 rows x 9 cols)
# 2 enchanted books in center, 1 slot gap between them
# Book 1 (slot 12): Physical Permissions
# Book 2 (slot 14): Command & Management Permissions
pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ $ ! $ @ $ $ $ $'
  - '$ $ $ $ $ $ $ $ $'

# Button slot mappings - used by PermissionBookButton
physical-book: '!'
commands-book: '@'

items:
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
  '!':
    type: ENCHANTED_BOOK
    name: '&6&lPhysical Permissions'
    lore:
      - '&7Toggle permissions that affect'
      - '&7physical interaction with the island.'
      - ''
      - '&eCategories:'
      - '&7- Break blocks'
      - '&7- Build blocks'
      - '&7- Chest access'
      - '&7- Drop/Pickup items'
      - ''
      - '&aClick to open!'
  '@':
    type: ENCHANTED_BOOK
    name: '&6&lCommand & Management'
    lore:
      - '&7Toggle command permissions and'
      - '&7island management abilities.'
      - ''
      - '&eCategories:'
      - '&7- Island Management (Member+)'
      - '&7- Island Settings'
      - '&7- RED FLAG (Dangerous)'
      - ''
      - '&cNote: Minimum role is Member.'
      - '&aClick to open!'

sounds:
  '!':
    type: BLOCK_NOTE_BLOCK_PLING
    volume: 0.2
    pitch: 0.2
  '@':
    type: BLOCK_NOTE_BLOCK_PLING
    volume: 0.2
    pitch: 0.2
