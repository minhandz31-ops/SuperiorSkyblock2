title: '&lIsland Panel'
previous-menu: true

pattern:
  - '2 2 2 2 2 2 2 2 2'
  - '# ! # @ # $ # 2 #'
  - '2 # ^ # * # 1 # 2'
  - '# ~ # = # + # 2 #'
  - '2 2 2 2 2 2 2 2 2'

members: '+'
settings: '@'

items:
  '!':
    type: SIGN
    name: '&eTeleport'
    lore:
      - '&7Teleport back to your island.'
  '@':
    type: DIODE
    name: '&eIsland Settings'
    lore:
      - '&7Manage settings regarding your island.'
  '$':
    type: ENDER_PEARL
    name: '&eIsland Permissions'
    lore:
      - '&7Manage permissions in your island.'
  '^':
    type: GOLD_INGOT
    name: '&eIsland Upgrades'
    lore:
      - '&7Upgrade your island statistics!'
  '*':
    type: PAPER
    name: '&eIsland Missions'
    lore:
      - '&7Complete missions and get rewarded!'
  '1':
    type: SMOOTH_BRICK
    name: '&eIsland Counts'
    lore:
      - '&7See all the blocks on your island!'
  '~':
    type: BARRIER
    name: '&eIsland Disband'
    lore:
      - '&7Disband your island.'
      - '&cThis action cannot be restored!'
  '=':
    type: CHEST
    name: '&eIsland Chest'
    lore:
      - '&7Open the community chest of the island.'
  '+':
    type: SKULL_ITEM
    data: 3
    name: '&eIsland Members'
    lore:
      - '&7Manage the members of the island.'
  '2':
    type: BLACK_STAINED_GLASS_PANE
    
    name: '&f'

sounds:
  '!':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '@':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '$':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '^':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '*':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '1':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '~':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '=':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2
  '+':
    type: ORB_PICKUP
    volume: 0.2
    pitch: 0.2

commands:
  '!':
    - '[player] is tp'
  '$':
    - '[player] is permissions'
  '^':
    - '[player] is upgrade'
  '*':
    - '[player] is missions'
  '1':
    - '[player] is counts'
  '~':
    - '[player] is disband'
  '=':
    - '[player] is chest'
  '+':
    - '[player] is members'
