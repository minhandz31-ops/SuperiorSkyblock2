        - '&7Right-click: &eWater Flow'
        - ''
        - '&7Click again to disable.'
    settings-disabled:
      type: GRAY_CONCRETE
      name: '&6Liquid: Lava / Water Flow'
      lore:
        - '&7Left-click: &bLava Flow'
        - '&7Right-click: &eWater Flow'
        - ''
        - '&7Currently &cDISABLED&7 (no flow).'
    sound:
