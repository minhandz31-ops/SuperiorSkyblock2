      volume: 0.2
      pitch: 0.2

  # Row 5: Natural mob spawn (Monster/Animals)
  NATURAL_MONSTER_SPAWN|NATURAL_ANIMALS_SPAWN:
    display-menu: true
    settings-enabled:
      type: GREEN_CONCRETE
      name: '&6Natural Spawn: Monster / Animal'
      lore:
        - '&7Left-click: &bNatural Monster Spawn'
        - '&7Right-click: &eNatural Animal Spawn'
        - ''
        - '&7Click again to disable.'
    settings-disabled:
      type: GRAY_CONCRETE
      name: '&6Natural Spawn: Monster / Animal'
      lore:
        - '&7Left-click: &bNatural Monster Spawn'
        - '&7Right-click: &eNatural Animal Spawn'
