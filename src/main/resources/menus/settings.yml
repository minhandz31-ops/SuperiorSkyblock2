title: '&lIsland Settings'
previous-menu: true

# 27-slot chest (3 rows x 9 cols)
# Border = '$', 7 pair-items = '@' in slots 11-17
pattern:
  - '$ $ $ $ $ $ $ $ $'
  - '$ @ @ @ @ @ @ @ $'
  - '$ $ $ $ $ $ $ $ $'

slots: '@'

items:
  '$':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'

# Each setting is a PAIR: "leftFlag|rightFlag"
# Left-click toggles leftFlag, Right-click toggles rightFlag
settings:
  # Row 1: Time (Night/Day)
  ALWAYS_NIGHT|ALWAYS_DAY:
    display-menu: true
    settings-enabled:
      type: YELLOW_CONCRETE
      name: '&6Time: Night / Day'
      lore:
        - '&7Left-click: &bAlways Night'
        - '&7Right-click: &eAlways Day'
        - ''
        - '&7Click again to disable.'
    settings-disabled:
      type: GRAY_CONCRETE
      name: '&6Time: Night / Day'
      lore:
        - '&7Left-click: &bAlways Night'
        - '&7Right-click: &eAlways Day'
        - ''
        - '&7Currently &cDISABLED&7 (natural cycle).'
    sound:
      type: BLOCK_NOTE_BLOCK_PLING
      volume: 0.2
      pitch: 0.2

  # Row 2: Weather (Rain/Shiny)
  ALWAYS_RAIN|ALWAYS_SHINY:
    display-menu: true
    settings-enabled:
      type: BLUE_CONCRETE
      name: '&6Weather: Rain / Clear'
      lore:
        - '&7Left-click: &bAlways Rain'
        - '&7Right-click: &eAlways Clear'
        - ''
        - '&7Click again to disable.'
    settings-disabled:
      type: GRAY_CONCRETE
      name: '&6Weather: Rain / Clear'
      lore:
        - '&7Left-click: &bAlways Rain'
        - '&7Right-click: &eAlways Clear'
        - ''
        - '&7Currently &cDISABLED&7 (natural weather).'
    sound:
      type: BLOCK_NOTE_BLOCK_PLING
      volume: 0.2
      pitch: 0.2

  # Row 3: Explosions (Creeper/TNT)
  CREEPER_EXPLOSION|TNT_EXPLOSION:
    display-menu: true
    settings-enabled:
      type: RED_CONCRETE
      name: '&6Explosions: Creeper / TNT'
      lore:
        - '&7Left-click: &bCreeper Explosion'
        - '&7Right-click: &eTNT Explosion'
        - ''
        - '&7Click again to disable.'
    settings-disabled:
      type: GRAY_CONCRETE
      name: '&6Explosions: Creeper / TNT'
      lore:
        - '&7Left-click: &bCreeper Explosion'
        - '&7Right-click: &eTNT Explosion'
        - ''
        - '&7Currently &cDISABLED&7 (explosions blocked).'
    sound:
      type: BLOCK_NOTE_BLOCK_PLING
      volume: 0.2
      pitch: 0.2

  # Row 4: Liquid flow (Lava/Water)
  LAVA_FLOW|WATER_FLOW:
    display-menu: true
    settings-enabled:
      type: ORANGE_CONCRETE
      name: '&6Liquid: Lava / Water Flow'
      lore:
